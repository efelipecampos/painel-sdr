# Essa VPS já roda Coolify, cujo Traefik (container "coolify-proxy") cuida de
# TLS/roteamento por domínio pra tudo na máquina via labels + a rede
# "coolify". Não publicamos porta nenhuma pro host — o Traefik fala com o
# container direto pela rede docker.
services:
  app:
    build: .
    container_name: poli-hubspot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - poli-hubspot-data:/app/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.poli-hubspot.loadbalancer.server.port=3000
      - traefik.http.routers.poli-hubspot-https.rule=Host(`poli-hubspot.camposai.com.br`)
      - traefik.http.routers.poli-hubspot-https.entrypoints=https
      - traefik.http.routers.poli-hubspot-https.tls.certresolver=letsencrypt
      - traefik.http.routers.poli-hubspot-https.service=poli-hubspot
      - traefik.http.routers.poli-hubspot-http.rule=Host(`poli-hubspot.camposai.com.br`)
      - traefik.http.routers.poli-hubspot-http.entrypoints=http
      - traefik.http.routers.poli-hubspot-http.middlewares=redirect-to-https@file

networks:
  coolify:
    external: true

volumes:
  poli-hubspot-data:
