# Painel SDR na VPS (Coolify). O Traefik do Coolify (container "coolify-proxy") cuida de domínio e HTTPS
# pelos labels + rede "coolify". Nenhuma porta é publicada no host (80/443 são do Traefik).
# Deploy: `npm run deploy` (scripts/deploy.sh) monta as imagens fora da VPS e só troca os containers lá
# (`docker compose up -d --no-build`). Não monte imagens na VPS: ver docs/deploy.md (incidente de 06/10/2026).
services:
  painel-web:
    image: painel-sdr-web:latest
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: painel-sdr-web
    restart: unless-stopped
    # Variáveis públicas + as do servidor para o Google Agenda (Fase 10c). A service_role e as chaves do Google
    # ficam só no processo do servidor (nomes sem NEXT_PUBLIC_: o Next nunca as envia ao navegador) e são usadas
    # só para guardar e usar a conexão da agenda dos closers e para agendar (apps/web/lib/supabase/admin.ts).
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}  # consulta do lead na hora de agendar (Fase 10d)
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.painel-sdr.loadbalancer.server.port=3000
      - traefik.http.routers.painel-sdr-https.rule=Host(`painel-sdr.camposai.com.br`)
      - traefik.http.routers.painel-sdr-https.entrypoints=https
      - traefik.http.routers.painel-sdr-https.tls.certresolver=letsencrypt
      - traefik.http.routers.painel-sdr-https.service=painel-sdr
      - traefik.http.routers.painel-sdr-http.rule=Host(`painel-sdr.camposai.com.br`)
      - traefik.http.routers.painel-sdr-http.entrypoints=http
      - traefik.http.routers.painel-sdr-http.middlewares=redirect-to-https@file

  painel-worker:
    image: painel-sdr-worker:latest
    build:
      context: .
      target: worker
    container_name: painel-sdr-worker
    restart: unless-stopped
    env_file:
      - .env

networks:
  coolify:
    external: true
