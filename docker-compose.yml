# Painel SDR na VPS (Coolify). O Traefik do Coolify (container "coolify-proxy") cuida de domínio e HTTPS
# pelos labels + rede "coolify". Nenhuma porta é publicada no host (80/443 são do Traefik).
# Deploy: `npm run deploy` (scripts/deploy.sh) monta as imagens fora da VPS e só troca os containers lá
# (`docker compose up -d --no-build`). Não monte imagens na VPS: ver docs/deploy.md (incidente de 06/10/2026).
services:
  painel-web:
    image: painel-sdr-web:latest
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: painel-sdr-web
    restart: unless-stopped
    # Variáveis públicas + as do servidor para o Google Agenda (Fase 10c). A service_role e as chaves do Google
    # ficam só no processo do servidor (nomes sem NEXT_PUBLIC_: o Next nunca as envia ao navegador) e são usadas
    # só para guardar e usar a conexão da agenda dos closers e para agendar (apps/web/lib/supabase/admin.ts).
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}  # consulta do lead na hora de agendar (Fase 10d)
      GOOGLE_CHAT_WEBHOOK_URL_ALERTAS: ${GOOGLE_CHAT_WEBHOOK_URL_ALERTAS:-}  # aviso de pedido de troca no "Gestão SDR" (Fase 10e)
      POLI_API_BASE_URL: ${POLI_API_BASE_URL:-}  # jornada (Fase 11): mensagem de teste da tela de regras
      POLI_API_TOKEN: ${POLI_API_TOKEN:-}
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.painel-sdr.loadbalancer.server.port=3000
      - traefik.http.routers.painel-sdr-https.rule=Host(`painel-sdr.camposai.com.br`)
      - traefik.http.routers.painel-sdr-https.entrypoints=https
      - traefik.http.routers.painel-sdr-https.tls.certresolver=letsencrypt
      - traefik.http.routers.painel-sdr-https.service=painel-sdr
      - traefik.http.routers.painel-sdr-http.rule=Host(`painel-sdr.camposai.com.br`)
      - traefik.http.routers.painel-sdr-http.entrypoints=http
      - traefik.http.routers.painel-sdr-http.middlewares=redirect-to-https@file

  painel-worker:
    image: painel-sdr-worker:latest
    build:
      context: .
      target: worker
    container_name: painel-sdr-worker
    restart: unless-stopped
    env_file:
      - .env

  # Integração Poli → HubSpot (antes no repositório PoliChat-Hubspot, trazida em 23/10/2026). Recebe o webhook da Poli,
  # registra no HubSpot e grava os eventos crus em public.raw_events. Mesmo domínio e mesmo volume da fila SQLite de antes.
  # O .env dela fica em apps/integracao/.env na VPS (copiado de /root/poli-hubspot/.env na troca).
  integracao:
    image: poli-hubspot:latest
    build:
      context: apps/integracao
    container_name: poli-hubspot
    restart: unless-stopped
    env_file:
      - apps/integracao/.env
    volumes:
      - poli-hubspot-data:/app/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.poli-hubspot.loadbalancer.server.port=3000
      - traefik.http.routers.poli-hubspot-https.rule=Host(`poli-hubspot.camposai.com.br`)
      - traefik.http.routers.poli-hubspot-https.entrypoints=https
      - traefik.http.routers.poli-hubspot-https.tls.certresolver=letsencrypt
      - traefik.http.routers.poli-hubspot-https.service=poli-hubspot
      - traefik.http.routers.poli-hubspot-http.rule=Host(`poli-hubspot.camposai.com.br`)
      - traefik.http.routers.poli-hubspot-http.entrypoints=http
      - traefik.http.routers.poli-hubspot-http.middlewares=redirect-to-https@file

networks:
  coolify:
    external: true

volumes:
  # Volume criado pelo projeto antigo (/root/poli-hubspot); guarda a fila SQLite da integração.
  poli-hubspot-data:
    external: true
    name: poli-hubspot_poli-hubspot-data
